<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>حصن | فاحص كلمات المرور</title>
<style>
  :root { --sand:#f3ede0; --green:#0b6b3a; --gold:#c8932f; --ink:#14261c; --muted:#5b6b62;
          --red:#c0392b; --yellow:#d4a017; --ok:#1e8449; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--sand); color:var(--ink);
         font-family: "Segoe UI", Tahoma, "Noto Kufi Arabic", sans-serif; }
  .sadu { height:16px; background:
          linear-gradient(135deg, var(--green) 25%, transparent 25%) -8px 0/16px 16px,
          linear-gradient(225deg, var(--gold) 25%, transparent 25%) -8px 0/16px 16px; }
  main { max-width:640px; margin:0 auto; padding:32px 16px 48px; }
  h1 { margin:0; font-size:40px; color:var(--green); }
  .sub { margin:4px 0 24px; color:var(--muted); }
  .box { background:#fff; border-radius:14px; padding:20px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  label { font-weight:600; display:block; margin-bottom:8px; }
  .row { display:flex; gap:8px; }
  input { flex:1; font-size:18px; padding:12px 14px; border:2px solid #d9d2c3; border-radius:10px;
          direction:ltr; text-align:left; }
  input:focus { outline:none; border-color:var(--green); }
  button { font-size:16px; padding:0 18px; border:0; border-radius:10px; cursor:pointer; }
  .show { background:#ebe5d8; color:var(--ink); }
  .check { background:var(--green); color:#fff; margin-top:12px; width:100%; padding:12px; font-size:18px; }
  .result { margin-top:20px; display:none; }
  .score { display:flex; align-items:baseline; gap:12px; }
  .score b { font-size:44px; }
  .bar { height:12px; background:#ebe5d8; border-radius:6px; overflow:hidden; margin:8px 0 16px; }
  .bar span { display:block; height:100%; width:0; transition:width .4s; }
  ul { list-style:none; padding:0; margin:0; }
  li { padding:10px 12px; border-radius:10px; margin-bottom:8px; background:#faf8f3; display:flex; gap:10px; }
  .dot { width:12px; height:12px; border-radius:50%; margin-top:5px; flex:none; }
  .red { background:var(--red); } .yellow { background:var(--yellow); } .green { background:var(--ok); }
  .t-red { color:var(--red); } .t-yellow { color:var(--yellow); } .t-green { color:var(--ok); }
  .note { margin-top:20px; font-size:14px; color:var(--muted); }
</style>
</head>
<body>
<div class="sadu"></div>
<main>
  <h1>حصن 🏰</h1>
  <p class="sub">فاحص كلمات المرور يفهم الأسماء العربية والعربيزي والتواريخ الهجرية.</p>

  <div class="box">
    <label for="pw">كلمة المرور</label>
    <div class="row">
      <input id="pw" type="password" autocomplete="off" placeholder="اكتب كلمة المرور هنا">
      <button class="show" id="toggle" type="button">إظهار</button>
    </div>
    <button class="check" id="check" type="button">افحص</button>

    <div class="result" id="result">
      <div class="score"><b id="score">0</b><span>/ 100</span><strong id="level"></strong></div>
      <div class="bar"><span id="bar"></span></div>
      <ul id="findings"></ul>
    </div>
  </div>

  <p class="note">🔒 يعمل حصن على جهازك فقط، ولا تُحفظ كلمة المرور ولا تُرسل إلى أي مكان.</p>
</main>
<script>
  const pw = document.getElementById("pw");
  document.getElementById("toggle").onclick = (e) => {
    const hidden = pw.type === "password";
    pw.type = hidden ? "text" : "password";
    e.target.textContent = hidden ? "إخفاء" : "إظهار";
  };
  async function check() {
    if (!pw.value) return;
    const res = await fetch("/check", { method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: pw.value }) });
    const r = await res.json();
    document.getElementById("result").style.display = "block";
    document.getElementById("score").textContent = r.score;
    const level = document.getElementById("level");
    level.textContent = r.level; level.className = "t-" + r.color;
    const bar = document.getElementById("bar");
    bar.style.width = r.score + "%"; bar.className = r.color;
    const list = document.getElementById("findings");
    list.innerHTML = "";
    if (r.findings.length === 0) {
      list.innerHTML = '<li><span class="dot green"></span><span>لم تُكتشف أي مشكلة واضحة.</span></li>';
    }
    for (const f of r.findings) {
      const li = document.createElement("li");
      const dot = document.createElement("span"); dot.className = "dot " + f.severity;
      const text = document.createElement("span"); text.textContent = f.ar;
      li.append(dot, text); list.append(li);
    }
  }
  document.getElementById("check").onclick = check;
  pw.addEventListener("keydown", (e) => { if (e.key === "Enter") check(); });
</script>
</body>
</html>
